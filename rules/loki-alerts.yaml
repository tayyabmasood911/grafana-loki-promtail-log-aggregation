groups:
  - name: loki_service_alerts
    rules:
      - alert: HighErrorRateSpike
        expr: |
          sum(rate({job="app-services"} |= "error" [5m])) by (service)
          /
          sum(rate({job="app-services"} [5m])) by (service) * 100 > 5
        for: 5m
        labels:
          severity: critical
          tier: application
        annotations:
          summary: "High HTTP 5xx error rate on {{ $labels.service }}"
          description: "Service {{ $labels.service }} log error rate has exceeded 5% over 5 minutes."

      - alert: CriticalServicePanic
        expr: |
          sum(rate({job=~".+"} |~ "(?i)(panic|fatal exception|segmentation fault)" [2m])) by (service) > 0
        for: 1m
        labels:
          severity: page
          tier: infrastructure
        annotations:
          summary: "Fatal panic or crash detected in {{ $labels.service }}"
          description: "Service {{ $labels.service }} logged unhandled fatal exception or panic."
